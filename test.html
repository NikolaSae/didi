<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIDI Particles Effect</title>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        .content-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .didi-text {
            font-size: 15vw;
            font-weight: 900;
            color: transparent;
            background: linear-gradient(45deg, #4285f4, #34A853, #FBBC05, #EA4335);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            text-align: center;
            animation: gradientShift 6s ease infinite;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            letter-spacing: 2vw;
            font-family: 'Courier New', monospace;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .subtitle {
            position: absolute;
            bottom: 10%;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1.5rem;
            opacity: 0.8;
            z-index: 10;
            font-family: monospace;
            pointer-events: none;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .didi-text {
                font-size: 20vw;
                letter-spacing: 1vw;
            }
            
            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    
    <div class="content-overlay">
        <h1 class="didi-text">DIDI</h1>
    </div>
    
    <div class="subtitle">
        Magični Svet Igre
