<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Logo Particles - Balans</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            background: #000; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #tsparticles { 
            position: fixed; 
            width: 100%; 
            height: 100%; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@1.43.1/tsparticles.min.js"></script>
</head>
<body>
    <div id="tsparticles"></div>

    <script>
    // Funkcija za konvertovanje SVG fajla u base64
    async function svgToBase64(svgUrl) {
        try {
            const response = await fetch(svgUrl);
            const svgText = await response.text();
            const base64 = btoa(unescape(encodeURIComponent(svgText)));
            return `data:image/svg+xml;base64,${base64}`;
        } catch (error) {
            console.error('Greška pri učitavanju SVG fajla:', error);
            return null;
        }
    }

    // Učitaj SVG i pokreni particles
    async function initParticles() {
        const svgBase64 = await svgToBase64('logotest19.svg');   
        if (!svgBase64) {
            console.error('Ne mogu da učitam SVG');
            return;
        }

        tsParticles.load("tsparticles", {
            pauseOnBlur: false,
            fpsLimit: 60,
            interactivity: {
                onClick: {
                    enable: true,
                    mode: "grab"
                },
                detectsOn: "canvas",
                events: {
                    onHover: {
                        enable: true,
                        mode: "bubble"
                    },
                    resize: true
                },
                modes: {
                    bubble: {
                        distance: 50,
                        duration: 2,
                        opacity: 1,
                        size: 3.5
                    },
                    grab: {
                        distance: 150,
                        links: {
                            opacity: 1
                        }
                    }
                }
            },
            particles: {
                color: {
                    value: ["#4285f4", "#34A853", "#FBBC05", "#EA4335"]
                },
                links: {
                    color: "random",
                    distance: 30,
                    enable: true,
                    opacity: 0.4,
                    width: 1
                },
                collisions: {
                    enable: false
                },
                move: {
                    enable: true,
                    direction: "none",
                    outModes: {
                        default: "bounce"
                    },
                    random: false,
                    speed: 0.2,
                    straight: false,
                    bounce: false
                },
                number: {
                    density: {
                        enable: false
                    },
                    value: 400
                },
                opacity: {
                    value: 0.6,
                    animation: {
                        enable: true,
                        speed: 0.3,
                        minimumValue: 0.3,
                        sync: false
                    }
                },
                shape: {
                    type: "circle"
                },
                size: {
                    value: 2,
                    random: {
                        enable: true,
                        minimumValue: 1
                    },
                    animation: {
                        enable: false
                    }
                }
            },
            polygon: {
                enable: true,
                type: "inline",
                move: {
                    radius: 2,
                    type: "path"
                },
                position: {
                    x: 0,
                    y: -20
                },
                inline: {
                    arrangement: "equidistant"
                },
                scale: 0.8,
                draw: {
                    enable: false
                },
                url: svgBase64
            },
            background: {
                color: "#000000"
            },
            detectRetina: true
        });
    }

    // Pokreni kada se stranica učita
    initParticles();
    </script>
</body>
</html>
