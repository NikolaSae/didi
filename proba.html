<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tsParticles Google Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #000000;
        }

        #tsparticles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div id="tsparticles"></div>
    
    <!-- PathSeg Polyfill - MORA BITI PRVI! -->
    <script src="https://cdn.jsdelivr.net/npm/pathseg@1.2.0/pathseg.min.js"></script>
    
    <!-- tsParticles v1 - stabilna verzija za polygon mask -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@1.43.1/tsparticles.min.js"></script>
    
    <script>
        tsParticles.load("tsparticles", {
            detectRetina: false,
            fpsLimit: 60,
            interactivity: {
                detectsOn: "canvas",
                events: {
                    onHover: {
                        enable: true,
                        mode: "bubble"
                    },
                    resize: true
                },
                modes: {
                    bubble: {
                        distance: 40,
                        duration: 2,
                        opacity: 8,
                        size: 6,
                        speed: 3
                    }
                }
            },
            particles: {
                color: {
                    value: ["#4285f4", "#34A853", "#FBBC05", "#EA4335"]
                },
                lineLinked: {
                    blink: false,
                    color: "random",
                    consent: false,
                    distance: 50,
                    enable: true,
                    opacity: 0.7,
                    width: 1.5
                },
                move: {
                    attract: {
                        enable: true
                    },
                    bounce: false,
                    direction: "none",
                    enable: true,
                    outMode: "bounce",
                    random: false,
                    speed: 2,
                    straight: true
                },
                number: {
                    density: {
                        enable: false
                    },
                    limit: 0,
                    value: 150
                },
                opacity: {
                    animation: {
                        enable: true,
                        minimumValue: 0.05,
                        speed: 24,
                        sync: true
                    },
                    random: {
                        enable: true,
                        minimumValue: 4.05
                    },
                    value: 4.4
                },
                shape: {
                    type: "circle"
                },
                size: {
                    animation: {
                        enable: false
                    },
                    random: false,
                    value: 2
                }
            },
            polygon: {
                draw: {
                    enable: true,
                    lineColor: "rgba(255,255,255,0.2)",
                    lineWidth: 0.6
                },
                enable: true,
                move: {
                    radius: 5
                },
                inlineArrangement: "equidistant",
                scale: 3.8,
                type: "inline",
                url: "https://sturdy-space-spoon-9jr455prwjh9g9-3000.app.github.dev/logotest3.svg",
                position: {
                    x: 50,
                    y: 50
                }
            }
        }).then(container => {
            console.log("✅ tsParticles v1 sa Polygon Mask učitan!");
        }).catch(error => {
            console.error("❌ Greška:", error);
        });
    </script>
</body>
</html>
